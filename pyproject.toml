[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ocean-resources"
version = "0.2.0"
description = "Herausgelöstes Ocean-Ressourcenmodul: RAM-Distributor, Modell-Runtime-Arbiter, Fähigkeitsmeldung, Nutzernähe-Klassen und Watchdog-Hysterese (#2441)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Lukas Geiger" }]
dependencies = []
keywords = [
    "ram-distributor",
    "resource-scheduler",
    "llm-inference",
    "model-runtime",
    "offline-core",
    "arbitration",
    "ocean",
    "bach",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Hardware",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

native = ["psutil>=5.9.6,<8"]

[project.scripts]
ocean-resource-client = "ocean_resources.client_cli:main"

[project.urls]
Homepage = "https://github.com/ellmos-ai/ocean-resources#readme"
Documentation = "https://github.com/ellmos-ai/ocean-resources#readme"
Repository = "https://github.com/ellmos-ai/ocean-resources.git"
Issues = "https://github.com/ellmos-ai/ocean-resources/issues"
Changelog = "https://github.com/ellmos-ai/ocean-resources/blob/main/CHANGELOG.md"
Contributing = "https://github.com/ellmos-ai/ocean-resources/blob/main/CONTRIBUTING.md"
"Code of Conduct" = "https://github.com/ellmos-ai/ocean-resources/blob/main/CODE_OF_CONDUCT.md"
Security = "https://github.com/ellmos-ai/ocean-resources/blob/main/SECURITY.md"
"LLM Ready" = "https://github.com/ellmos-ai/ocean-resources/blob/main/llms.txt"
"LLM Guidance" = "https://github.com/ellmos-ai/ocean-resources/blob/main/llm.txt"

[tool.setuptools.packages.find]
where = ["."]
include = ["ocean_resources*"]

[tool.setuptools.package-data]
ocean_resources = ["*.json"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
norecursedirs = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    ".ruff_cache",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
