name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master, chore/hygiene-ci-pep621-packaging-20261114 ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,native]"
          python -m pip check
      - name: Whitespace check
        run: git diff --check
      - name: Lint with ruff
        run: python -m ruff check .
      - name: Validate bytecode compilation
        run: python -m compileall -q ocean_resources tests
      - name: Smoke test packaged CLI resources
        run: |
          python -m ocean_resources manifest
          python -m ocean_resources catalog
          python -m ocean_resources fixture-demo
      - name: Run test suite
        run: python -m pytest -ra -v
