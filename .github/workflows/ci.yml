name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Verify zero-dependency stdlib-only import
        run: |
          python -c "import ocean_resources, ocean_resources.model_dispatch, ocean_resources.ram_distributor, ocean_resources.mlx_model_port"
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,native]" "setuptools>=77.0.3" build
          python -m pip check
      - name: Whitespace check
        run: git diff --check
      - name: Lint with ruff
        run: python -m ruff check .
      - name: Validate bytecode compilation
        run: python -m compileall -q ocean_resources tests
      - name: Verify sdist and wheel packaging contents
        run: |
          python -c "import shutil, subprocess, sys, tarfile, tempfile, zipfile; from pathlib import Path; out = Path(tempfile.mkdtemp()); subprocess.run([sys.executable, '-m', 'build', '--no-isolation', '--sdist', '--wheel', '--outdir', str(out)], check=True); whl = next(out.glob('*.whl')); sdist = next(out.glob('*.tar.gz')); zf = zipfile.ZipFile(whl); wn = zf.namelist(); zf.close(); tf = tarfile.open(sdist); sn = tf.getnames(); tf.close(); assert any(n.endswith('LICENSE') for n in wn) and any(n.endswith('THIRD_PARTY_LICENSES.md') for n in wn); assert 'ocean_resources/py.typed' in wn and 'ocean_resources/manifest.json' in wn and 'ocean_resources/pipeline-catalog.json' in wn; assert any(n.endswith('/TODO.md') for n in sn) and any(n.endswith('/SECURITY.md') for n in sn); shutil.rmtree(out, ignore_errors=True)"
      - name: Smoke test packaged CLI resources
        run: |
          python -m ocean_resources manifest
          python -m ocean_resources catalog
          python -m ocean_resources fixture-demo
      - name: Run test suite
        run: python -m pytest -ra -v
